name: Build ARM64 Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Permanent release key stored in GitHub secrets (same signature on every version)
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 secret not set; falling back to a temporary debug key"
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release (arm64-v8a)
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle clean assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          python3 - <<'PY'
          lines = [l.rstrip() for l in open('build.log', errors='replace')]
          keys = ('e: ', 'error:', 'error: ', 'What went wrong', 'Execution failed', 'Unresolved', 'AAPT')
          errs = [l for l in lines if l.startswith('e: ') or any(k in l for k in keys[1:])]
          errs = [l for l in errs if 'warning' not in l.lower()][:60]
          for i in range(0, len(errs), 12):
              chunk = errs[i:i + 12]
              msg = '%0A'.join(c.replace('%', '%25').replace('\r', '')[:700] for c in chunk)
              print('::error title=Build error::' + msg)
          PY

      - name: Report lint details
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          out = []
          for f in glob.glob('app/build/reports/lint-results-*.txt'):
              out += [l.rstrip() for l in open(f, errors='replace')][:60]
          lines = [l.rstrip() for l in open('build.log', errors='replace')]
          for i, l in enumerate(lines):
              if 'Lint found' in l or 'lint-results' in l:
                  out += lines[max(0, i - 3):i + 30]
                  break
          for i, l in enumerate(lines):
              if 'What went wrong' in l:
                  out += lines[i:i + 25]
                  break
          if out:
              print('::error title=Lint details::' + '%0A'.join(o.replace('%', '%25')[:400] for o in out[:60]))
          PY

      - name: List APKs
        run: find app/build/outputs/apk -name "*.apk" 2>/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          TAG="v$VERSION"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "MissionPlayer-$TAG-arm64-v8a.apk"
          # The release page shows only what changed in THIS version: the section of
          # RELEASE_NOTES.md whose heading is "## MissionPlayer v<version> ..." (older sections stay
          # in the file but are not published). If no heading matches, the newest section is used.
          awk -v ver="$VERSION" '
            /^## MissionPlayer v/ { show = (index($0, "v" ver " ") > 0 || $0 ~ ("v" ver "$")) }
            show' RELEASE_NOTES.md > release-notes-current.md
          if [ ! -s release-notes-current.md ]; then
            awk '/^## MissionPlayer v/ { n++ } n == 1' RELEASE_NOTES.md > release-notes-current.md
          fi
          if [ ! -s release-notes-current.md ]; then
            echo "MissionPlayer $TAG" > release-notes-current.md
          fi
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "MissionPlayer-$TAG-arm64-v8a.apk" \
            --target "$GITHUB_SHA" \
            --title "MissionPlayer $TAG" \
            --notes-file release-notes-current.md
