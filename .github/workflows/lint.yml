name: Code quality

on:
  push:
    branches: [ main ]
    paths: [ '**.kt', '**.kts', '.editorconfig', 'config/detekt/**', '.github/workflows/lint.yml' ]
  pull_request:
    paths: [ '**.kt', '**.kts', '.editorconfig', 'config/detekt/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ktlint-detekt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: ktlint
        run: |
          curl -sSLo ktlint https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x ktlint
          ./ktlint "app/src/**/*.kt" "*.kts" "app/*.kts"
      - name: detekt
        run: |
          curl -sSLo detekt-cli.jar https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar
          java -jar detekt-cli.jar --input app/src/main/java,app/src/test/java,app/src/androidTest/java \
            --config config/detekt/detekt.yml --build-upon-default-config --baseline config/detekt/baseline.xml
