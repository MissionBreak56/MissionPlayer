name: Verify branch

on:
  push:
    branches: [ qualidade-v2.24.0 ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and instrumented-test compilation
        run: gradle :app:testDebugUnitTest :app:assembleDebugAndroidTest --no-daemon --console=plain 2>&1 | tee verify.log
      - name: Summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t=f=e=0
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(p).getroot(); t+=int(r.get('tests')); f+=int(r.get('failures')); e+=int(r.get('errors'))
              for c in r.iter('testcase'):
                  for k in list(c):
                      if k.tag in ('failure','error'):
                          print('::error title=Test failed::%s.%s: %s' % (c.get('classname'), c.get('name'), (k.get('message') or '')[:400].replace('\n',' ')))
          print('::notice title=Unit tests::tests=%d failures=%d errors=%d' % (t,f,e))
          PY
      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|error:|Execution failed" verify.log | head -40 | while read -r l; do echo "::error title=Build error::$l"; done
