name: Unit tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --console=plain 2>&1 | tee test.log
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t=f=e=s=0
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(p).getroot()
              t+=int(r.get('tests'));f+=int(r.get('failures'));e+=int(r.get('errors'));s+=int(r.get('skipped'))
              for c in r.iter('testcase'):
                  for k in list(c):
                      if k.tag in ('failure','error'):
                          print('::error title=Test failed::%s.%s: %s' % (c.get('classname'), c.get('name'), (k.get('message') or '')[:400].replace('\n',' ')))
          print('::notice title=Unit tests::tests=%d failures=%d errors=%d skipped=%d' % (t,f,e,s))
          PY
      - name: Report compile errors
        if: failure()
        run: grep -E "^e: |What went wrong|error:" test.log | head -40 | while read -r l; do echo "::error title=Build error::$l"; done
